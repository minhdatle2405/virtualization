
name: CI/CD Pipeline

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Project_CNPM_NEW/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Project_CNPM_NEW/backend/package-lock.json

      - name: Check backend files
        run: |
          test -f package.json
          test -f package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test --if-present

  frontend-build-test:
    name: Frontend Test & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Project_CNPM_NEW/my-app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Project_CNPM_NEW/my-app/package-lock.json

      - name: Check frontend files
        run: |
          test -f package.json
          test -f package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test -- --watchAll=false
        env:
          CI: "true"

      - name: Build frontend
        run: npm run build
        env:
          CI: "true"
